name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os:   windows-latest
            node: '22'
          - os:   macos-latest
            node: '22'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        # One command, the same one a contributor runs: build, check that dist/
        # holds exactly the three deployable files, then drive the built page
        # in a real browser. The script is the definition; this runs it.
        run: npm run verify

      - name: Keep the test report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Publish the deployable files
        # The three files a web server needs, from a run whose tests passed —
        # downloadable from the run page instead of being built by hand.
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: MetrologicalCBORValidator
          path: dist/
          retention-days: 30
